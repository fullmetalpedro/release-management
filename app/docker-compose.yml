services:
  app:
    build: .
    ports: ["3001:3001"]
    env_file: .env
    # Sem segredo as sessões não são gravadas e todos caem a cada restart: o compose não sobe sem ele.
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
    volumes: [data:/app/server/.data]
    restart: unless-stopped
volumes:
  data:
